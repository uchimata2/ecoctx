<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" role="img" aria-label="Two graded runs: observations held versus bands held">
  <style>
    .card { fill: #fbfbfa; }
    .ttl  { font: 600 15px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #1c1b19; }
    .sub  { font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #6b6862; }
    .run  { font: 600 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3a3833; }
    .lbl  { font: 400 12px ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #3a3833; }
    .val  { font: 600 12px ui-monospace, "SF Mono", Menlo, Consolas, monospace; fill: #1c1b19; }
    .trk  { fill: #eceae5; }
    .obs  { fill: #3f6b4a; }
    .bnd  { fill: #c4622d; }
  </style>

  <rect class="card" x="0" y="0" width="760" height="280" rx="6"/>
  <text class="ttl" x="28" y="34">What held, and what did not</text>
  <text class="sub" x="28" y="54">Two graded runs on unrelated subjects. Each bar is filled to the share that held.</text>

  <!-- run 1 -->
  <text class="run" x="28" y="92">First graded run, thirteen findings</text>
  <text class="lbl" x="28"  y="118">the observation</text>
  <rect class="trk" x="180" y="106" width="440" height="16" rx="3"/>
  <rect class="obs" x="180" y="106" width="440" height="16" rx="3"/>
  <text class="val" x="632" y="119">13 of 13</text>

  <text class="lbl" x="28"  y="146">the proposed fix</text>
  <rect class="trk" x="180" y="134" width="440" height="16" rx="3"/>
  <rect class="bnd" x="180" y="134" width="68"  height="16" rx="3"/>
  <text class="val" x="632" y="147">2 of 13</text>

  <!-- run 2 -->
  <text class="run" x="28" y="192">Second graded run, six findings</text>
  <text class="lbl" x="28"  y="218">the observation</text>
  <rect class="trk" x="180" y="206" width="440" height="16" rx="3"/>
  <rect class="obs" x="180" y="206" width="440" height="16" rx="3"/>
  <text class="val" x="632" y="219">6 of 6</text>

  <text class="lbl" x="28"  y="246">the proposed fix</text>
  <rect class="trk" x="180" y="234" width="440" height="16" rx="3"/>
  <rect class="bnd" x="180" y="234" width="293" height="16" rx="3"/>
  <text class="val" x="632" y="247">4 of 6</text>
</svg>
